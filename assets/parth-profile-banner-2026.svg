    <text x="66" y="165" font-size="26" fill="#426b51" font-weight="650">AI/ML · Generative AI · Software Development</text>
    <text x="67" y="208" font-size="18" fill="#40514d">Building practical technology for agriculture, accessibility,</text>
    <text x="67" y="236" font-size="18" fill="#40514d">and everyday problems — from intelligent models to mobile apps.</text>
    <!-- Featured projects as restrained labels -->
    <rect x="66" y="270" width="190" height="42" rx="21" fill="#e0e8dc" stroke="#a6b9a1"/>
    <circle cx="87" cy="291" r="5" fill="#4c7656"/>
    <text x="101" y="297" font-size="15" fill="#284633" font-weight="650">NabhKrishi</text>
    <rect x="268" y="270" width="158" height="42" rx="21" fill="#efe1d5" stroke="#d8b39d"/>
    <circle cx="289" cy="291" r="5" fill="#bb7258"/>
    <text x="303" y="297" font-size="15" fill="#6f4334" font-weight="650">ISL Gloss</text>
    <rect x="438" y="270" width="174" height="42" rx="21" fill="#dfe9ed" stroke="#a6c0ca"/>
    <circle cx="459" cy="291" r="5" fill="#548699"/>
    <text x="473" y="297" font-size="15" fill="#2d5967" font-weight="650">Flutter · Dart</text>
    <text x="67" y="353" font-size="14" fill="#65766b">CSE (AI)  ·  AWS Certified Cloud Practitioner  ·  India</text>
    <path d="M66 383H855" stroke="#c8d0c4" stroke-width="1.5"/>
    <text x="67" y="411" font-size="13" fill="#617269" letter-spacing="2.1">IDEAS INTO IMPACT</text>
    <text x="67" y="438" font-size="16" fill="#344c40" font-style="italic">Learning continuously. Building thoughtfully.</text>
