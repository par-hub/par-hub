<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Parth Singh — AI, software and real-world impact</title>
  <desc id="desc">A calm editorial-style personal profile banner in warm ivory, forest green, sage, terracotta and muted blue. It highlights AI and machine learning, generative AI, Flutter and Dart, NabhKrishi, and ISL Gloss.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf5"/>
      <stop offset="1" stop-color="#f1efe5"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#739174"/>
      <stop offset="1" stop-color="#3e654e"/>
    </linearGradient>
    <clipPath id="landClip">
      <rect x="956" y="30" width="585" height="386" rx="28"/>
    </clipPath>
  </defs>
  <rect width="1600" height="500" rx="26" fill="url(#paper)"/>
  <!-- Quiet editorial background accents -->
  <circle cx="895" cy="75" r="190" fill="#e5e8da" opacity=".36"/>
  <circle cx="1480" cy="30" r="135" fill="#e7d9cb" opacity=".35"/>
  <path d="M58 48H816" stroke="#c6cec0" stroke-width="1.5"/>
